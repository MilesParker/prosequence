id: free-transit
title: Should fares be removed from public transit?
definitions:
  - term: just
    text: >
      For the purposes of this discourse space, a policy is just if it removes a systematically
      inequitable burden and expands access to full civic and economic participation regardless of
      income.
    importedFrom: null
  - term: public good
    text: >
      A good whose benefits are non-excludable and accrue to users and non-users alike, such that
      individual consumption does not diminish availability to others.
    importedFrom: null
  - term: user-pays principle
    text: >
      The allocation principle that those who directly benefit from a service should bear its costs
      in proportion to their use.
    importedFrom: null
