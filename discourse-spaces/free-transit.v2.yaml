    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0660d78c98dd
    tag: Boston's network resembles its peers
    text: >-
      Boston's network size, density, and modal mix are comparable to many other mid-to-large
      transit systems.
    terminal: false
    attribution:
      source:
        type: CommonKnowledge
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0661259507f9
    tag: Modal shift produces emissions reduction
    text: >-
      A ridership increase large enough to shift modal share away from private cars would produce
      measurable emissions reductions
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0662c0d63889
    tag: Modal shift reduces congestion
    text: >-
      Modal shift from cars to transit at sufficient scale produces measurable congestion reduction
      benefiting all road users
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-066342f250dd
    tag: Reduced cost expands labour market catchment
    text: >-
      Reduced travel cost and increased network use expands the effective labour market catchment
      for low-income workers
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0664b4dd096f
    tag: Fare payment causes dwell time
    text: >-
      Fare payment at boarding is a direct cause of dwell time; removing it reduces dwell time
      regardless of ridership levels
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-06658f78a3b0
    tag: Low recovery makes overhead disproportionate
    text: >-
      Where recovery rates are very low, the overhead of collection consumes a substantial fraction
      of what is recovered, making collection economically irrational
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-06667f30117e
    tag: Non-user benefits justify collective funding
    text: >-
      Benefits that accrue to non-users as well as users justify cost distribution across the whole
      population rather than individual user charges
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-066778e7f879
    tag: Systematic burden removal is redistributive
    text: >-
      When a cost burden falls systematically on already-disadvantaged groups, removing it is a
      redistributive act that advances racial and economic justice
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-06681ec18c01
    tag: Transit is prerequisite for participation
    text: >-
      Transit access is a prerequisite for participation in economic and social life, and such
      prerequisites should be guaranteed regardless of income
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0669bf88f992
    tag: Revenue dependency is representative
    text: >-
      Cities with high fare revenue dependency are representative of large transit systems
      generally, and the dependency would apply elsewhere
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-066acae14dbe
    tag: TransitCenter methodology reliable
    text: >-
      TransitCenter's research methodology and independence make its survey findings reliable
      evidence about rider priorities across income levels
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-066b25daf385
    tag: TransitCenter is independent and peer-reviewed
    text: >-
      TransitCenter is an independent research organisation with a track record of peer-reviewed
      transit research.
    terminal: false
    attribution:
      source:
        type: CommonKnowledge
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-066c78627076
    tag: Fare not employment constraint
    text: >-
      Removing the fare barrier does not address the other factors constraining employment — job
      availability, skill match, childcare
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-066d96350989
    tag: Concentrated benefits justify bearing costs
    text: >-
      Those who receive concentrated benefits from a service should bear its costs proportionally;
      diffuse spillover benefits do not justify general-population funding
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-066e0cd2205b
    tag: Middle income transfer is regressive
    text: >-
      A subsidy transferring resources from the general tax base to middle-income commuters moves
      money in the wrong direction, but only if tax incidence on low-income non-riders is
      non-trivial
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-066f65c19606
    tag: Regressivity requires quantitative support
    text: >-
      The regressivity argument requires that the tax incidence on low-income non-riders be
      non-trivial — a quantitative claim not established by the grounds alone
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0670e5365138
    tag: Local antisocial reports are representative
    text: >-
      Local reports of antisocial behaviour following fare elimination are representative of a
      general effect rather than local anomalies
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-06715a028c39
    tag: Universal wastes, targeting concentrates
    text: >-
      Universal provision wastes resources on those who do not need the subsidy; targeting
      concentrates them where they have effect
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067291c458e5
    tag: Luxembourg is representative
    text: >-
      Luxembourg's operational experience is sufficiently similar to other national contexts to
      demonstrate general viability
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067366af093a
    tag: Kansas City is representative
    text: Kansas City is representative of mid-sized U.S. transit contexts
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-06740782cae1
    tag: Unaddressed barriers reassert
    text: >-
      Fare removal addresses only one barrier to transit use; unaddressed barriers reassert
      themselves over time and erode initial ridership gains
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067529d0b1a5
    tag: Transit meets essentiality criteria
    text: >-
      If transit meets the same criteria of essentiality as acknowledged public utilities it
      warrants the same treatment
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0676b05d5198
    tag: Private substitutes are relevant disanalogy
    text: >-
      The existence of private substitutes for transit is a relevant disanalogy that undermines the
      public utility comparison
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0677e74ce270
    tag: Toronto and Hong Kong not exceptional
    text: >-
      Toronto and Hong Kong are not so exceptional that their fare recovery experience is irrelevant
      to other systems
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-06788bc303c7
    tag: Problem character signals composition change
    text: >-
      A change in the character of system problems, not just their scale, is a reliable sign of a
      change in user composition
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067908653179
    tag: RCT supersedes observational studies
    text: >-
      The methodological superiority of the RCT design makes its null finding on employment the best
      available evidence, superseding observational studies
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067a0aad35d4
    tag: Selective user-pays needs justification
    text: Applying user-pays to transit but not roads requires justification that has not been
      provided
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067b6445489a
    tag: User-pays legitimately applies to transit
    text: >-
      The user-pays principle is applied consistently across comparable public services, so it
      legitimately governs transit funding rather than being invoked selectively.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067ca82c53ee
    tag: Consistent outcome indicates general pattern
    text: >-
      Consistency of outcome across independent cases indicates a general pattern rather than
      coincidence or local factors
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067dc76bd541
    tag: Diverse success establishes viability
    text: >-
      Consistent success across diverse contexts establishes that fare-free transit is not merely
      theoretical but a proven operational model
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067e5d3629e7
    tag: Fare elimination causes ridership increase
    text: >-
      Removing a direct cost barrier to transit use causes an increase in ridership among
      price-sensitive riders
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-067f2922b058
    tag: Ridership increase causes modal shift
    text: >-
      A sufficiently large ridership increase produces modal shift from private cars, since new
      riders must come from somewhere
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0680f19bfd36
    tag: Fare-free meets justice definition
    text: >-
      A policy that removes a systematically inequitable burden and expands access to civic
      participation meets the standard of justice as defined in this discourse space
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca0c-7688-aedb-0681a97002bf
    tag: Ridership raises cost without revenue
    text: >-
      Carrying additional riders raises operating cost, and fare removal eliminates the revenue
      stream that would otherwise fund the additional service that volume requires.
    terminal: false
    uncertain: false
    submissionStatus: Accepted

