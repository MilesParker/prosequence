    uncertain: false
    submissionStatus: Accepted

  - id: w-low-recovery-overhead
    tag: Warrant — low recovery makes overhead disproportionate
    claim: Where recovery rates are very low, the overhead of collection consumes a substantial fraction of what is recovered, making collection economically irrational
    grounds:
      text: N/A
      source:
        type: LogicalNecessity
    scheme: FromConsequence
    cluster: Pro
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-non-user-benefits-justify-collective
    tag: Warrant — non-user benefits justify collective funding
    claim: Benefits that accrue to non-users as well as users justify cost distribution across the whole population rather than individual user charges
