id: free-transit
title: Should fares be removed from public transit?

definitions:
  - term: just
    text: >
      For the purposes of this discourse space, a policy is just if it removes
      a systematically inequitable burden and expands access to full civic and
      economic participation regardless of income.
    importedFrom: null
  - term: public good
    text: >
      A good whose benefits are non-excludable and accrue to users and
      non-users alike, such that individual consumption does not diminish
      availability to others.
    importedFrom: null
  - term: user-pays principle
    text: >
      The allocation principle that those who directly benefit from a service
      should bear its costs in proportion to their use.
    importedFrom: null

proposition:
  id: proposition-free-transit
  tag: Fares should be removed
  text: Fares should be removed from public transit

arguments:

  # --- Pro-free arguments connecting directly to root ---

  - id: low-income-mobility-gains
    tag: Low income mobility gains
    claim: Eliminating fares would improve mobility for low-income riders
    grounds:
      text: >
        Sustainable America and Dr. Destiny Thomas (Streetsblog, 2022) report
        that low-income people spend a disproportionate share of income on
        transit and ration trips accordingly.
      source:
        type: Citation
        reference: "Sustainable America; Dr. Destiny Thomas, Streetsblog/Freakonomics (2022)"
    scheme: FromExample
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: emissions-reduction
    tag: Emissions reduction
    claim: Fare-free transit would reduce carbon emissions
    grounds:
      text: >
        The Rapid Transition Alliance (2021) and World Resources Institute
        (2023) report that private vehicles account for over half of
        transport-sector GHG emissions and that transit emits substantially
        less per passenger-km.
      source:
        type: Citation
        reference: "Rapid Transition Alliance (2021); World Resources Institute (2023)"
    scheme: FromCause
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: congestion-reduction
    tag: Congestion reduction
    claim: Fare-free transit would reduce road congestion
    grounds:
      text: >
        Increased transit ridership reduces the number of private vehicles
        on the road, as each additional transit trip substitutes for a car
        trip at the margin.
      source:
        type: CommonKnowledge
    scheme: FromCause
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: labour-market-access
    tag: Labour market access
    claim: Fare-free transit improves labour market access
    grounds:
      text: >
        Broader transit use expands the geographic range of job opportunities
        accessible to workers without cars, particularly in cities where
        employment is dispersed.
      source:
        type: CommonKnowledge
    scheme: FromConsequence
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: boarding-speed
    tag: Boarding speed
    claim: Fare-free transit would speed up bus service
    grounds:
      text: >
        Streetsblog/Freakonomics (2022) reports Boston data showing a 6%+
        reduction in boarding time per passenger on fare-free routes.
      source:
        type: Citation
        reference: "Streetsblog/Freakonomics (2022); Boston Mayor Wu, cited in Modeshift (2024)"
    scheme: FromCause
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: collection-cost-not-justified
    tag: Collection cost not justified
    claim: The administrative cost of fare collection is not justified by the revenue it generates
    grounds:
      text: >
        Streetsblog/Freakonomics (2022) and the Pacific Research Institute
        (2024) report that Kansas City farebox recovery was approximately 10%
        and that collection infrastructure, enforcement, and fare evasion
        management consume substantial resources.
      source:
        type: Citation
        reference: "Streetsblog/Freakonomics (2022); Pacific Research Institute (2024)"
    scheme: FromConsequence
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: collective-benefit-justifies-funding
    tag: Collective benefit justifies collective funding
    claim: Transit should be funded collectively regardless of individual use
    grounds:
      text: >
        Reduced congestion, lower emissions, and broader labour market access
        benefit people who never board a bus or train.
      source:
        type: CommonKnowledge
    scheme: FromConsequence
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: access-as-right
    tag: Access as right
    claim: Access to public transit should not be contingent on ability to pay
    grounds:
      text: N/A
      source:
        type: None
    scheme: FromDefinition
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: fare-free-transit-is-just
    tag: Fare-free transit is just
    claim: Fare-free transit is just
    grounds:
      text: N/A
      source:
        type: None
    scheme: FromDefinition
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Anti-free arguments connecting directly to root ---

  - id: service-degradation
    tag: Service degradation from revenue loss
    claim: Eliminating fares would degrade service quality
    grounds:
      text: >
        TransitCenter, cited in the Pacific Research Institute (2024) and
        David Bragdon at the Harvard/HKS debate, reports that fare revenue
        funds 40-62% of infrastructure costs in major U.S. cities including
        New York, Chicago, and San Francisco.
      source:
        type: Citation
        reference: "TransitCenter, cited in Pacific Research Institute (2024); David Bragdon, Harvard/HKS debate"
    scheme: FromExample
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: user-pays-as-policy
    tag: User pays as policy
    claim: Riders, not all taxpayers, should bear transit costs
    grounds:
      text: >
        Transit users receive direct, immediate benefits; non-users receive
        only diffuse spillovers such as marginally reduced congestion.
      source:
        type: CommonKnowledge
    scheme: FromConsequence
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: targeted-subsidies-more-effective
    tag: Targeted subsidies more effective
    claim: Targeted subsidies for low-income riders are more effective than universal free transit
    grounds:
      text: >
        Modeshift (2024) and Nicholas Bloom (Hunter College) report that
        means-tested programmes such as discounted passes direct resources
        to those for whom cost is a binding constraint while preserving
        revenue from those who can pay.
      source:
        type: Citation
        reference: "Modeshift (2024); Nicholas Bloom (Hunter College); The Conversation (2025)"
    scheme: FromConsequence
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Mediating nodes ---

  - id: ridership-increase
    tag: Ridership increase
    claim: Fare-free transit would increase overall ridership
    grounds:
      text: >
        Multiple cities including Boston, Kansas City, and Luxembourg have
        reported substantial ridership increases following fare elimination.
      source:
        type: Citation
        reference: "Modeshift (2024); Rapid Transition Alliance (2021)"
    scheme: FromGeneralization
    cluster: Pro
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  # --- Mid-level pro arguments ---

  - id: racial-justice
    tag: Racial justice
    claim: Fare elimination is a racial and economic justice measure
    grounds:
      text: >
        Dr. Destiny Thomas (Streetsblog, 2022) and Sustainable America report
        that Black and Hispanic commuters are overrepresented among
        transit-dependent riders and that low-income households spend
        disproportionately more of their budget on fares.
      source:
        type: Citation
        reference: "Dr. Destiny Thomas, Streetsblog (2022); Sustainable America"
    scheme: FromConsequence
    cluster: Pro
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: transit-utility-analogy
    tag: Transit as public utility analogy
    claim: Public transit should be treated like other essential public utilities
    grounds:
      text: >
        Water, electricity, and sanitation are provided as public services
        on the grounds that universal access is essential to civic life.
      source:
        type: CommonKnowledge
    scheme: FromAnalogy
    cluster: Analogy
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: user-pays-applied-inconsistently
    tag: User pays applied inconsistently
    claim: Applying the user-pays principle selectively to transit while socialising road costs is inconsistent
    grounds:
      text: >
        Gov1 and Planetizen (2025) report that road infrastructure is funded
        through general taxation and fuel levies that fall well short of
        full-cost recovery.
      source:
        type: Citation
        reference: "Gov1; Planetizen (2025)"
    scheme: FromAnalogy
    cluster: Pro
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Mid-level anti arguments ---

  - id: fare-removal-wont-reach-needy
    tag: Fare removal won't reach those who need it
    claim: Free fares would not substantially increase ridership among people who need transit most
    grounds:
      text: >
        TransitCenter rider surveys across income levels, cited in Sustainable
        America and the Harvard/HKS debate, consistently rank reliability and
        frequency above fare cost as determinants of transit use.
      source:
        type: Citation
        reference: "TransitCenter research, cited in Sustainable America; Harvard/HKS debate (Bragdon)"
    scheme: FromAuthority
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: null-employment-effect
    tag: Null employment effect
    claim: Free transit does not improve employment outcomes for low-income riders
    grounds:
      text: >
        A King County RCT reported in Rochester Beacon (2025) found no
        statistically significant effect on employment, earnings, hours
        worked, or job stability among free-transit recipients.
      source:
        type: Citation
        reference: "King County (Seattle) RCT, reported in Rochester Beacon (2025)"
    scheme: FromCause
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: universal-free-transit-regressive
    tag: Universal free transit is regressive
    claim: Universal free transit funded by general taxation is regressive
    grounds:
      text: >
        Nicholas Bloom (Hunter College), cited in Sustainable America, reports
        that transit commuters skew middle-income and that low-income
        non-drivers and non-riders also pay general taxes.
      source:
        type: Citation
        reference: "Nicholas Bloom (Hunter College), cited in Sustainable America; Gov1"
    scheme: FromConsequence
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: antisocial-behaviour-generalised
    tag: Antisocial behaviour (generalised)
    claim: Fare elimination reliably produces increases in antisocial behaviour
    grounds:
      text: >
        Transportation for America (2025) and The Daily Economy (2025) report
        that multiple independent cities across different contexts have
        reported similar disorder effects after removing fares.
      source:
        type: Citation
        reference: "Transportation for America (2025); The Daily Economy (2025)"
    scheme: FromGeneralization
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: high-farebox-recovery-viable
    tag: High farebox recovery viable
    claim: Well-run transit systems can sustain significant fare revenue without sacrificing ridership
    grounds:
      text: >
        Streets.mn (2013) reports that Toronto requires 75% farebox recovery
        as a condition of provincial subsidy and has high ridership, and that
        Hong Kong's MTR operates profitably.
      source:
        type: Citation
        reference: "Streets.mn (2013)"
    scheme: FromExample
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: ridership-gains-plateau
    tag: Ridership gains plateau without service improvement
    claim: Ridership gains from fare removal are unlikely to be sustained without parallel service improvements
    grounds:
      text: >
        Modeshift (2024) and Transportation for America (2025) report that
        cities which removed fares without improving frequency or coverage
        have seen ridership growth plateau or reverse.
      source:
        type: Citation
        reference: "Modeshift (2024); Transportation for America (2025)"
    scheme: FromGeneralization
    cluster: Anti
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Empirical evidence nodes ---

  - id: luxembourg-viability
    tag: Luxembourg operational viability
    claim: Free transit is operationally viable at scale — Luxembourg
    grounds:
      text: >
        Sustainable America (2023) reports that Luxembourg implemented
        nationwide free transit in 2020 and the system continues to operate.
      source:
        type: Citation
        reference: "Sustainable America (2023)"
    scheme: FromExample
    cluster: Empirical
    depth: 4
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: kansas-city-ridership
    tag: Kansas City ridership
    claim: Eliminating fares increases ridership in mid-sized U.S. cities — Kansas City
    grounds:
      text: >
        Modeshift (2024) and Streetsblog (2022) report that Kansas City went
        fare-free and reported sustained ridership growth without service
        collapse.
      source:
        type: Citation
        reference: "Modeshift (2024); Streetsblog (2022)"
    scheme: FromExample
    cluster: Empirical
    depth: 4
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: boston-ridership-gains
    tag: Boston ridership gains
    claim: Boston fare-free routes showed strong ridership gains
    grounds:
      text: >
        Modeshift (2024) reports Boston fare-free routes saw 35% ridership
        growth versus 15% system-wide, 2021-22.
      source:
        type: Citation
        reference: "Modeshift (2024)"
    scheme: FromExample
    cluster: Empirical
    depth: 4
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: many-examples-successful-implementation
    tag: Many examples of successful implementation
    claim: Many examples of successful fare-free implementation exist
    grounds:
      text: >
        Luxembourg, Kansas City, Boston and over 100 cities globally have
        implemented fare-free transit with positive operational outcomes.
      source:
        type: Citation
        reference: "Rapid Transition Alliance (2021); Modeshift (2024)"
    scheme: FromGeneralization
    cluster: Pro
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: antisocial-behaviour-local
    tag: Antisocial behaviour (local reports)
    claim: Fare-free transit increases antisocial behaviour on the system
    grounds:
      text: >
        Transportation for America (2025) and The Daily Economy (2025) report
        that some fare-free cities have seen increases in vandalism, theft,
        and use of vehicles as shelter following fare elimination.
      source:
        type: Citation
        reference: "Transportation for America (2025); The Daily Economy (2025)"
    scheme: FromExample
    cluster: Empirical
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: user-composition-shift
    tag: User composition shift
    claim: Removing fares changes the composition of transit users, not just their number
    grounds:
      text: >
        Transportation for America (2025) and The Daily Economy (2025) report
        increased vagrancy and antisocial behaviour following fare elimination,
        indicating a shift in user type alongside any increase in volume.
      source:
        type: Citation
        reference: "Transportation for America (2025); The Daily Economy (2025)"
    scheme: FromSign
    cluster: Empirical
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: service-quality-over-fare
    tag: Service quality over fare cost
    claim: Service quality matters more to riders than fare cost
    grounds:
      text: >
        David Bragdon (TransitCenter) at the Harvard/HKS debate reports that
        TransitCenter has conducted systematic rider surveys across income
        levels and cities consistently finding reliability and frequency
        ranked above fare price.
      source:
        type: Citation
        reference: "David Bragdon (TransitCenter), Harvard/HKS debate"
    scheme: FromAuthority
    cluster: Anti
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: rct-warrant-defence
    tag: RCT warrant defence
    claim: The King County RCT is the best available evidence on employment outcomes
    grounds:
      text: >
        Rochester Beacon (2025) reports that the King County study is the
        only known RCT on this question and that RCTs isolate causal effects
        better than observational studies.
      source:
        type: Citation
        reference: "Rochester Beacon (2025) reporting on King County study"
    scheme: FromAuthority
    cluster: Empirical
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: driving-underpriced
    tag: Driving underpriced (road costs socialised)
    claim: Road infrastructure is funded through general taxation — an example of socialised costs for a user-specific service
    grounds:
      text: >
        Gov1 and Planetizen (2025) report that road infrastructure is funded
        through general taxation and fuel levies that fall well short of
        full-cost recovery for road wear, congestion, and pollution.
      source:
        type: Citation
        reference: "Gov1; Planetizen (2025)"
    scheme: FromExample
    cluster: Empirical
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: utility-analogy-fails
    tag: Public utility analogy fails
    claim: The public utility analogy for transit is unsound
    grounds:
      text: >
        Water and sanitation have no private substitutes; transit competes
        directly with cars, taxis, and ride-hailing services.
      source:
        type: CommonKnowledge
    scheme: FromAnalogy
    cluster: Analogy
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

