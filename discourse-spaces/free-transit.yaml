    scheme: FromCause
    cluster: Pro
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-reduced-cost-expands-catchment
    tag: Warrant — reduced cost expands labour market catchment
    claim: Reduced travel cost and increased network use expands the effective labour market catchment for low-income workers
    grounds:
      text: N/A
      source:
        type: LogicalNecessity
    scheme: FromConsequence
    cluster: Pro
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-fare-payment-dwell-time
    tag: Warrant — fare payment causes dwell time
    claim: Fare payment at boarding is a direct cause of dwell time; removing it reduces dwell time regardless of ridership levels
    grounds:
      text: N/A
