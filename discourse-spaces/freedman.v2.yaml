id: us-iran-ceasefire-2026
title: US-Iran Ceasefire Agreement 2026
definitions:
  - term: strategic interests
    text: >
      US strategic interests include: security of regional allies, freedom of navigation through
      international waterways, non-proliferation of nuclear weapons and long-range missiles, and
      credibility of US security commitments.
    importedFrom: null
  - term: ceasefire agreement
    text: >
      The preliminary memorandum of understanding of June 2026 between the US and Iran, covering
      cessation of hostilities, 60-day toll-free Hormuz passage, and a framework for subsequent
      nuclear negotiations contingent on Israel halting operations in Lebanon.
    importedFrom: null
  - term: military leverage
    text: >
      The capacity to credibly threaten or apply military force to extract concessions. Leverage is
      expended when a campaign has ended without achieving its objective and renewed escalation is
      not credible.
    importedFrom: null
