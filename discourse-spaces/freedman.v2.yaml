    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1acb3c530913
    tag: A carve-out implies Iran sets the default
    text: >-
      A 60-day carve-out implies a default state to which passage reverts — a default in which Iran
