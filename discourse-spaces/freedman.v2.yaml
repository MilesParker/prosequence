    terminal: false
    attribution:
      source:
        type: LogicalNecessity
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad0f0fd0633
    tag: Sycophancy caused miscalculation
    text: >-
      Trump and Netanyahu's purge of internal dissent caused the strategic miscalculation about
      Iran's likely response.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad1cf98e66a
    tag: Unchecked leaders default to electoral logic
    text: >-
      When internal dissent is purged, no strategic counsel remains to check electoral incentive, so
      decisions default to the leader's electoral interest.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad2ffb233f5
    tag: 'Mukunda: Both decision mechanisms failed'
    text: >-
