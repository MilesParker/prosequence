    terminal: false
    attribution:
      source:
        type: LogicalNecessity
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1acc9e599214
    tag: Ended campaign signals escalation ceiling
    text: >-
      Once a military campaign ends without achieving its core objective, the threat of renewed
      force becomes less credible, weakening the position for deferred objectives.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1acd2148b3ad
    tag: Settling short signals an escalation ceiling
    text: >-
      A state that has struck and accepted a deal short of its objective signals a ceiling on its
      willingness to escalate.
    terminal: false
    attribution:
      source:
        type: CommonKnowledge
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1aceb5a5bd44
    tag: Citizen welfare is national interest
    text: >-
      Ending a war causing domestic inflation serves the material interests of US citizens, which
      are a component of US national interests.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1acf761cb44c
    tag: Ending a harmful war advances welfare
    text: >-
      If citizen material welfare is a component of national interests, and the war was harming that
