    terminal: false
    attribution:
      source:
        type: Citation
        reference: Gautam Mukunda, as quoted by Friedman, New York Times, June 19 2026
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad39be66a80
    tag: Obama double standard
    text: >-
      The deal's terms are worse than what the same actors condemned as unacceptable under Obama, so
      partisan praise carries no evidentiary weight.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad4cc6483a5
    tag: Critique invokes foreign democratic survival
    text: >-
      The double-standard critique evaluates the deal against the survival of democratic
      governance in other states rather than against the interests of US citizens.
    terminal: false
    attribution:
      source:
        type: LogicalNecessity
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad5468c9705
    tag: Obama would have been denounced for this
    text: >-
      Friedman notes the deal makes nuclear talks contingent on Israeli military concessions in
      Lebanon, and states Obama would have been denounced for agreeing to such terms.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Thomas L. Friedman, New York Times, June 19 2026
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad62d287e96
    tag: Democratic survival is a valid yardstick
    text: >-
      Evaluating this deal by its effect on the survival of democratic governance in the
      international order is a legitimate and applicable standard for judging US strategic
      interest, not an illegitimate substitution for the interests of US citizens.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad7d43f9432
    tag: Iranian domestic politics unlocked
    text: A diminished external threat may create space for internal Iranian pressure for regime
      reform.
    terminal: false
    uncertain: true
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad836213ff2
    tag: Iranians may question theocratic rule
    text: >-
      Friedman speculates that without an external threat to justify repression, Iranians may ask
      what 47 years of theocratic rule has produced besides nuclear spending and proxy funding.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Thomas L. Friedman, New York Times, June 19 2026
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ad9c7133f2b
    tag: Expert exclusion causes predictive failure
    text: >-
      When decision-makers exclude expert challenge, predictive failures that experts would have
      flagged are structurally caused by that exclusion.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ada93360942
    tag: Removing the corrective attributes the error
    text: >-
      Removing the input that would have corrected an error makes that error attributable to the
      removal.
    terminal: false
    attribution:
      source:
        type: LogicalNecessity
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1adba88fa0c5
    tag: Partisan evaluation lacks evidentiary weight
    text: >-
      When the same outcome is condemned under one administration and praised under another with no
      change in strategic logic, the evaluation is partisan and carries no independent evidentiary
      weight.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1adc2f6402db
    tag: Identity-selective criteria lack force
    text: >-
      An evaluation criterion applied selectively by identity rather than consistently by logic
      cannot serve as independent evidence of merit.
    terminal: false
    attribution:
      source:
        type: SelfEvident
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1addcf0d484d
    tag: External threat removal unlocks internal politics
    text: >-
      Regimes that use external threat narratives to suppress dissent lose that justification when
      the threat recedes, potentially enabling domestic opposition to organise.
    terminal: false
    uncertain: true
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ade52ed9150
    tag: Regimes instrumentalise external threats
    text: >-
      It is common knowledge that authoritarian regimes instrumentalise external threats to justify
      internal repression.
    terminal: false
    attribution:
      source:
        type: CommonKnowledge
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1adf85dd8a56
    tag: Dealmaking skills don't transfer
    text: >-
      Transactional deal-making skills do not transfer to geopolitical negotiations involving
      military leverage and alliance management.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ae0814b3a76
    tag: Negotiators secured only 60 days
    text: >-
      Friedman reports that real-estate negotiators Witkoff and Kushner, after billions spent in
      military action, secured only 60 days of toll-free Hormuz passage, with no constraints on
      missiles or proxies and no resolution of Iran's nuclear material.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Thomas L. Friedman, New York Times, June 19 2026
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ae1bc5674f3
    tag: Dealmaking skills are not geopolitical skills
    text: >-
      Real-estate negotiation optimises for closing a transaction; geopolitical negotiation requires
      preserving leverage and foreclosing future coercion options — these are not extensions of the
      same skill.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ae2a800c170
    tag: Closing and foreclosing are distinct
    text: >-
      Closing a deal and foreclosing an adversary's future coercion options are structurally
      distinct objectives requiring distinct competencies.
    terminal: false
    attribution:
      source:
        type: SelfEvident
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1ae39a54c735
    tag: Witkoff-Kushner Hormuz outcome
    text: >-
      The Witkoff-Kushner Hormuz negotiation is a concrete instance of transactional logic producing
      a strategically deficient outcome.
    terminal: false
    uncertain: false
    submissionStatus: Accepted

