      source:
        type: CommonKnowledge
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: 019fab4a-ca74-7736-a2ea-1acaada4718e
    tag: Time-limited carve-out sets a precedent
    text: >-
      A time-limited toll-free commitment without a permanent successor establishes the precedent
