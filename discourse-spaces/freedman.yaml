id: us-iran-ceasefire-2026
title: "US-Iran Ceasefire Agreement 2026"

definitions:
  - term: strategic interests
    text: >
      US strategic interests include: security of regional allies, freedom of
      navigation through international waterways, non-proliferation of nuclear
      weapons and long-range missiles, and credibility of US security commitments.
    importedFrom: null

  - term: ceasefire agreement
    text: >
      The preliminary memorandum of understanding of June 2026 between the US and
      Iran, covering cessation of hostilities, 60-day toll-free Hormuz passage,
      and a framework for subsequent nuclear negotiations contingent on Israel
      halting operations in Lebanon.
    importedFrom: null

  - term: military leverage
    text: >
      The capacity to credibly threaten or apply military force to extract
      concessions. Leverage is expended when a campaign has ended without
      achieving its objective and renewed escalation is not credible.
    importedFrom: null

proposition:
  id: prop-us-iran-ceasefire
  tag: Deal serves US strategic interests
  text: The US-Iran ceasefire agreement of June 2026 serves US strategic interests.

terminalValueNodes:

  - id: t-alliance-system-value
    tag: Alliance system value (terminal)
    text: States are more secure inside a reliable alliance system than they can ever be acting alone.

  - id: t-leader-self-interest-legitimate
    tag: Leader self-interest legitimate (terminal)
    text: A leader's personal political survival is a legitimate criterion in state decisions.

  - id: t-suffering-constrains-strategy
    tag: Suffering constrains strategy (terminal)
    text: Minimising human suffering is a supreme obligation that constrains permissible strategic action.

  - id: t-reason-over-instinct
    tag: Reason over instinct (terminal)
    text: Human reason carefully applied and subject to correction is a more reliable guide to action than instinct or intuition.

  - id: t-order-depends-on-democracy
    tag: Order depends on democracy (terminal)
    text: A state's long-run security depends on the survival of democratic governance in the international order it inhabits.

  - id: t-realist-state-primacy
    tag: Realist state primacy (terminal)
    text: A state owes obligations only to its own citizens; the political character of other states is not a legitimate basis for foreign policy.

arguments:

  # --- Depth 1: Anti arguments connecting directly to root ---

  - id: electoral-not-strategic
    tag: Electoral not strategic
    claim: The deal was shaped by Trump's electoral interests, not US strategic interests.
    grounds:
      text: >
        Friedman reports Trump assessed the war's inflation and gasoline price
        effects as a prescription for Republican midterm losses, and publicly
        pre-assigned credit and blame to Vance along personal political lines.
      source:
        type: Citation
        reference: "Thomas L. Friedman, New York Times, June 19 2026"
    scheme: FromCause
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: allies-abandoned
    tag: Allies abandoned
    claim: The deal leaves US allies more exposed than before the war began.
    grounds:
      text: >
        Friedman reports the deal is silent on Iran's missiles and proxy networks,
        makes nuclear talks contingent on Israeli concessions in Lebanon, and
        signals to Gulf Arab states that the US is withdrawing its security guarantee.
      source:
        type: Citation
        reference: "Thomas L. Friedman, New York Times, June 19 2026"
    scheme: FromConsequence
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: hormuz-concession
    tag: Hormuz toll concession
    claim: The deal concedes Iran a potential future right to toll commercial shipping through the Strait of Hormuz.
    grounds:
      text: >
        The memorandum of understanding states Iran will ensure toll-free Hormuz
        passage "for 60 days only," as quoted by Friedman.
      source:
        type: Citation
        reference: "US-Iran MOU June 2026, as quoted by Friedman, New York Times, June 19 2026"
    scheme: FromConsequence
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: nuclear-leverage-gone
    tag: Nuclear leverage expended
    claim: The deal defers the nuclear question into a negotiation where the US has already expended its military leverage.
    grounds:
      text: >
        Friedman reports the deal leaves Iran's near-bomb-grade uranium for future
        negotiations after the military campaign ended without achieving that objective.
      source:
        type: Citation
        reference: "Thomas L. Friedman, New York Times, June 19 2026"
    scheme: FromConsequence
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 1: Pro argument ---

  - id: deal-ended-economic-harm
    tag: Deal ended economic harm
    claim: The deal serves US interests by ending a war that was driving inflation and energy price increases.
    grounds:
      text: >
        Friedman acknowledges Trump assessed the war as causing food inflation and
        high gasoline prices harmful to American households.
      source:
        type: Citation
        reference: "Thomas L. Friedman, New York Times, June 19 2026"
    scheme: FromConsequence
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 2: Warrant nodes for depth-1 arguments ---

  - id: w-electoral-calendar
    tag: Warrant — electoral calendar proximate cause
    claim: When a negotiating outcome tracks the leader's electoral calendar rather than strategic logic, electoral pressure is the proximate cause.
    grounds:
      text: >
        An outcome explicable by electoral timing without remainder requires no
        additional strategic explanation.
      source:
        type: SelfEvident
    scheme: FromCause
    cluster: Anti
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-capability-retention
    tag: Warrant — capability retention increases exposure
    claim: Removing US military pressure while leaving Iran's threatening capabilities intact increases allies' net threat exposure.
    grounds:
      text: >
        If the constraining force is removed and the constrained capability
        remains, the net threat to those the force was protecting increases.
      source:
        type: LogicalNecessity
    scheme: FromConsequence
    cluster: Anti
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-withdrawal-signal
    tag: Warrant — withdrawal signal forces accommodation
    claim: Allies who receive credible signals of US withdrawal must independently accommodate the rising regional power, shifting the balance against the US.
    grounds:
      text: >
        States balance against threats when patron protection is withdrawn.
      source:
        type: CommonKnowledge
    scheme: FromConsequence
    cluster: Anti
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-hormuz-precedent
    tag: Warrant — 60-day carve-out establishes precedent
    claim: A time-limited toll-free commitment without a permanent successor establishes the precedent that Iran holds authority to charge for Hormuz passage.
    grounds:
      text: >
        A 60-day carve-out implies a default state to which passage reverts —
        a default in which Iran determines the terms.
      source:
        type: LogicalNecessity
    scheme: FromConsequence
    cluster: Anti
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-leverage-expended
    tag: Warrant — ended campaign signals escalation ceiling
    claim: Once a military campaign ends without achieving its core objective, the threat of renewed force becomes less credible, weakening the position for deferred objectives.
    grounds:
      text: >
        A state that has struck and accepted a deal short of its objective
        signals a ceiling on its willingness to escalate.
      source:
        type: CommonKnowledge
    scheme: FromCause
    cluster: Anti
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-economic-harm
    tag: Warrant — citizen welfare is national interest
    claim: Ending a war causing domestic inflation serves the material interests of US citizens, which are a component of US national interests.
    grounds:
      text: >
        If citizen material welfare is a component of national interests, and the
        war was harming that welfare, ending it advances national interests on
        that dimension.
      source:
        type: LogicalNecessity
    scheme: FromConsequence
    cluster: Pro
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 2: Supporting and attacking argument nodes ---

  - id: sycophancy-caused-miscalculation
    tag: Sycophancy caused miscalculation
    claim: Trump and Netanyahu's purge of internal dissent caused the strategic miscalculation about Iran's likely response.
    grounds:
      text: >
        Mukunda told Friedman that America and Israel "failed at both" mechanisms
        for good executive decisions, and that "experts had predicted everything
        that went wrong in the war."
      source:
        type: Citation
        reference: "Gautam Mukunda, as quoted by Friedman, New York Times, June 19 2026"
    scheme: FromCause
    cluster: Anti
    depth: 2
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: obama-double-standard
    tag: Obama double standard
    claim: The deal's terms are worse than what the same actors condemned as unacceptable under Obama, so partisan praise carries no evidentiary weight.
    grounds:
      text: >
        Friedman notes the deal makes nuclear talks contingent on Israeli military
        concessions in Lebanon, and states Obama would have been denounced for
        agreeing to such terms.
      source:
        type: Citation
        reference: "Thomas L. Friedman, New York Times, June 19 2026"
    scheme: FromAnalogy
    cluster: Analogy
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: iranian-politics-unlocked
    tag: Iranian domestic politics unlocked
    claim: A diminished external threat may create space for internal Iranian pressure for regime reform.
    grounds:
      text: >
        Friedman speculates that without an external threat to justify repression,
        Iranians may ask what 47 years of theocratic rule has produced besides
        nuclear spending and proxy funding.
      source:
        type: Citation
        reference: "Thomas L. Friedman, New York Times, June 19 2026"
    scheme: FromConsequence
    cluster: Pro
    depth: 2
    isMediating: true
    uncertain: true
    submissionStatus: Accepted

  # --- Depth 3: Warrant nodes for depth-2 arguments ---

  - id: w-expert-exclusion
    tag: Warrant — expert exclusion causes predictive failure
    claim: When decision-makers exclude expert challenge, predictive failures that experts would have flagged are structurally caused by that exclusion.
    grounds:
      text: >
        Removing the input that would have corrected an error makes that error
        attributable to the removal.
      source:
        type: LogicalNecessity
    scheme: FromCause
    cluster: Anti
    depth: 3
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-identity-evaluation
    tag: Warrant — identity-driven evaluation lacks evidentiary weight
    claim: When the same outcome is condemned under one administration and praised under another with no change in strategic logic, the evaluation is partisan and carries no independent evidentiary weight.
    grounds:
      text: >
        An evaluation criterion applied selectively by identity rather than
        consistently by logic cannot serve as independent evidence of merit.
      source:
        type: SelfEvident
    scheme: FromAnalogy
    cluster: Analogy
    depth: 3
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  - id: w-threat-removal-unlocks-politics
    tag: Warrant — external threat removal unlocks internal politics
    claim: Regimes that use external threat narratives to suppress dissent lose that justification when the threat recedes, potentially enabling domestic opposition to organise.
    grounds:
      text: >
        It is common knowledge that authoritarian regimes instrumentalise
        external threats to justify internal repression.
      source:
        type: CommonKnowledge
    scheme: FromConsequence
    cluster: Pro
    depth: 3
    isMediating: true
    uncertain: true
    submissionStatus: Accepted

  # --- Depth 3: Generalisation node ---

  - id: dealmaking-skills-dont-transfer
    tag: Dealmaking skills don't transfer
    claim: Transactional deal-making skills do not transfer to geopolitical negotiations involving military leverage and alliance management.
    grounds:
      text: >
        Friedman observes that real-estate negotiators Witkoff and Kushner,
        after billions spent in military action, secured only 60 days of
        toll-free Hormuz passage with no commitments on missiles, proxies,
        or nuclear material.
      source:
        type: Citation
        reference: "Thomas L. Friedman, New York Times, June 19 2026"
    scheme: FromGeneralization
    cluster: Anti
    depth: 3
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 4: Warrant for generalisation ---

  - id: w-dealmaking-transfer
    tag: Warrant — dealmaking skills are not geopolitical skills
    claim: Real-estate negotiation optimises for closing a transaction; geopolitical negotiation requires preserving leverage and foreclosing future coercion options — these are not extensions of the same skill.
    grounds:
      text: >
        Closing a deal and foreclosing an adversary's future coercion options
        are structurally distinct objectives requiring distinct competencies.
      source:
        type: SelfEvident
    scheme: FromGeneralization
    cluster: Anti
    depth: 4
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 4: Example node ---

  - id: witkoff-kushner-example
    tag: Witkoff-Kushner Hormuz outcome
    claim: The Witkoff-Kushner Hormuz negotiation is a concrete instance of transactional logic producing a strategically deficient outcome.
    grounds:
      text: >
        Friedman reports the specific terms: billions in military expenditure
        yielded 60 days of toll-free passage, no missile constraints, no proxy
        constraints, and no resolution of Iran's nuclear material.
      source:
        type: Citation
        reference: "Thomas L. Friedman, New York Times, June 19 2026"
    scheme: FromExample
    cluster: Empirical
    depth: 4
    isMediating: true
    uncertain: false
    submissionStatus: Accepted

