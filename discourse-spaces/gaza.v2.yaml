id: gaza-genocide
title: Is Israel's military campaign in Gaza genocide?
definitions:
  - term: genocide
    text: >
      The intentional destruction, in whole or in part, of a national, ethnic, racial, or religious
      group as such, as defined by the 1948 UN Convention on the Prevention and Punishment of the
      Crime of Genocide. Requires both specific intent (dolus specialis) and acts carried out in
      pursuance of that intent.
    importedFrom: null
  - term: genocidal intent
    text: >
      The specific intent to destroy a protected group as such — not merely to cause civilian harm
      incidental to a military objective. Distinct from general malice, recklessness, or
      disproportionate force. Can be inferred from a pattern of acts when direct evidence of intent
      is unavailable.
    importedFrom: null
  - term: ethnic cleansing
    text: >
      The forced displacement of an ethnic or religious group from a territory, whether by
      expulsion, intimidation, or destruction of conditions for habitation. Distinct from genocide
      in that it aims at removal rather than destruction of the group as such, though the two crimes
      can overlap or morph into each other.
    importedFrom: null
