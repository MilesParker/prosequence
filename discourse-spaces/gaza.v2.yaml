        type: Citation
        reference: Bret Stephens, New York Times, July 22 2025
      quote: >-
        furious comments in the wake of Hamas's Oct. 7 atrocities hardly amount to a Wannsee
        conference
    uncertain: false
    submissionStatus: Accepted
  - id: c-civilian-institutions-systematically-destroyed
    tag: 'Bartov: Civilian institutions destroyed'
    text: >-
      Bartov reports systematic destruction not only of housing but of all institutions necessary
      for civilian life and for the reconstitution of the group: hospitals, universities, schools,
      mosques, cultural heritage sites, water treatment plants, and agricultural areas — a pattern
      his former IDF chief of staff Moshe Yaalon publicly described as ethnic cleansing aimed at
      clearing northern Gaza of its population.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Omer Bartov, New York Times, 2025
      quote: the systematic destruction in Gaza not only of housing but also of other infrastructure
    uncertain: false
    submissionStatus: Accepted
  - id: c-mosul-analogy
    tag: Mosul drew no genocide charge
    text: >-
      The US-backed Mosul campaign against ISIS used comparable tactics to Israel's Gaza campaign
      and produced comparable civilian casualties, yet no credible genocide charge was made against
      the US or Iraq.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: c-embedded-adversary-explains-casualties
    tag: Embedded adversary explains casualty rate
    text: >-
      Where an armed group embeds itself in dense urban terrain and uses the civilian population as cover,
      the resulting civilian casualty rate is explained by the tactical situation rather than by the attacking
      state's intent.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: c-tactical-explanation-is-unbounded
    tag: Tactical explanation admits no upper limit
    text: >-
      An explanation that attributes civilian casualties to an adversary's embedding admits no upper limit:
      it is equally available at any level of destruction, up to the elimination of the entire built environment.
      A defence consistent with every outcome constrains none of them.
    terminal: false
    attribution:
      source:
        type: LogicalNecessity
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: c-mosul-campaign-11000-civilian-deaths
    tag: 'Stephens: Mosul killed up to 11,000 civilians'
    text: >-
      Stephens cites the 2016–17 Mosul campaign, in which American airstrikes leveled entire blocks
      and as many as 11,000 civilians died over nine months as ISIS used civilians as human shields,
      and notes the campaign had broad bipartisan and international support with no campus protests
      or genocide charges.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Bret Stephens, New York Times, July 22 2025
      quote: American airstrikes have at times leveled entire blocks
    uncertain: false
    submissionStatus: Accepted
  - id: c-mosul-representativeness
    tag: Mosul analogy is structurally comparable to Gaza
    text: >-
      The Mosul campaign is a structurally comparable case — a state military operating in dense
      urban terrain against an armed group using human shields and tunnel infrastructure — making
      the absence of a genocide charge in that case evidentially relevant to Gaza.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: c-tactical-similarity-suffices-for-comparison
    tag: Tactical similarity licenses the comparison
    text: >-
      Where two campaigns share tactical structure — dense urban terrain, an adversary using tunnel infrastructure
      and human shields — that similarity is sufficient to make the legal characterisation of one evidentially
      relevant to the other.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: c-isis-and-hamas-used-same-urban-strategy
    tag: 'Stephens: ISIS and Hamas used one strategy'
    text: >-
      Stephens notes that ISIS, like Hamas, used a booby-trapped underground fortress strategy in a
      dense urban environment, with the same dynamic of combatants below ground and civilians above
      ground that characterises the Gaza campaign.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Bret Stephens, New York Times, July 22 2025
      quote: booby-trapped, underground fortress
    uncertain: false
    submissionStatus: Accepted
  - id: c-genocide-label-antisemitism-charge
    tag: Genocide label serves antisemitic function
    text: >-
      The genocide charge against Israel is used by anti-Zionists to equate Israel with Nazi
      Germany, licensing Jew-hatred and targeting diaspora Jews who support Israel.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: c-genocide-charge-among-bogus-delegitimising-charges
    tag: 'Stephens: Charge delegitimises the state'
    text: >-
      Stephens argues the genocide charge is part of a pattern of "inflated or bogus charges"
      deployed by Israel's opponents to delegitimise the state and generate hatred not only of
      Israeli policy but of Jews who support Israel's existence, making supporters of a
      genocide-committing state guilty of genocide by association.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Bret Stephens, New York Times, July 22 2025
      quote: equate modern Israel with Nazi Germany
    uncertain: false
    submissionStatus: Accepted
  - id: c-genocide-label-silences-critics
    tag: Antisemitism charge silences legitimate critique
    text: >-
      Labelling the genocide designation as antisemitic is itself a mechanism of intellectual
      suppression that immunises Israeli actions from legitimate scrutiny.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: c-genocide-scholars-accused-of-antisemitism
    tag: 'Bartov: Scholars accused of antisemitism'
    text: >-
      Bartov reports that genocide scholars who apply the designation to Gaza have been accused by
      Holocaust historians of "well-poisoning" and antisemitism, and specifically that Norman Goda
      characterised showing images of Palestinian children killed by Israeli bombs as an antisemitic
      act — a position Bartov treats as demonstrably untenable.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Omer Bartov, New York Times, 2025
      quote: >-
        showing images of Palestinian children ripped apart by U.S.-made bombs launched by Israeli
        pilots is, in this view, an antisemitic act
    uncertain: false
    submissionStatus: Accepted
  - id: c-intent-inferred-from-conduct
    tag: Intent inferable without a planning document
    text: >-
      In genocide adjudication, specific intent (dolus specialis) may be established by inference
      from the totality of acts and statements when no direct planning document is available; the
      absence of a Wannsee-style document does not foreclose a finding of intent.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: c-intent-derivable-from-operations
    tag: >-
      Bartov: Intent derivable from operations pattern
    text: >-
      Bartov states that genocidal intent can also be derived from a pattern of operations on the ground.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Omer Bartov, New York Times, 2025, citing genocide jurisprudence
      quote: intent can also be derived from a pattern of operations on the ground
    uncertain: false
    submissionStatus: Accepted
  - id: c-courts-inferred-intent-from-conduct
    tag: 'ICJ/ICTY: Intent inferred from conduct'
    text: >-
      Courts including the ICJ and the ICTY have found genocidal intent by inference from conduct in the
      absence of direct documentary evidence.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: ICJ and ICTY genocide judgments
      quote: >-
        CITATION NEEDED
    uncertain: false
    submissionStatus: Accepted
  - id: c-confinement-transforms-cleansing
    tag: No receiving territory makes expulsion destruction
    text: >-
      When a target population has no adjacent territory to receive them, expulsion orders combined
      with ongoing destruction of survival conditions are functionally equivalent to destruction of
      the group as such — making Gaza structurally disanalogous to cases where the displaced
      population could flee.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: c-sealed-borders-make-displacement-destruction
    tag: 'Bartov: Sealed borders make flight impossible'
    text: >-
      Bartov argues that Gaza's borders are sealed by Egypt and Israel, so displacement orders
      combined with bombardment are equivalent to an order to cease to exist as a group; Stephens's
      Mosul analogy is undermined by this structural difference, since Mosul's civilian population
      could and did flee the city whereas Gazans have no receiving territory.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Omer Bartov, New York Times, 2025; Bret Stephens, New York Times, July 22 2025
      quote: null
    uncertain: false
    submissionStatus: Accepted
  - id: c-holocaust-memory-universalism
    tag: Holocaust's lesson is universal, not particular
    text: >-
      The moral authority Holocaust remembrance generates is premised on the universality of its
      lesson; invoking that memory to shield a state from genocide charges contradicts the
      foundation of the authority being claimed.
    terminal: false
    uncertain: false
    submissionStatus: Accepted
  - id: c-holocaust-lesson-presented-as-universal
    tag: 'Bartov: Holocaust lesson framed as universal'
    text: >-
      Bartov argues that Holocaust commemoration succeeded in finding a universal audience precisely
      by presenting its lesson as a warning for all humanity; using Holocaust victimhood as a
      justification for inhumanity toward others transforms the lesson into its opposite and
      destroys the moral credit it generates.
    terminal: false
    attribution:
      source:
        type: Citation
        reference: Omer Bartov, New York Times, 2025
      quote: >-
        transforming its meaning from an assertion of resistance to inhumanity wherever it is
        perpetrated to an excuse
    uncertain: false
    submissionStatus: Accepted
  - id: c-restraint-in-killing-not-restraint-in-destruction
    tag: Restraint in killing, not in destruction
    text: >-
      A state that deploys far less than its capacity to kill while deploying near its full capacity
      to destroy housing, infrastructure, and civilian institutions has selected those targets
      deliberately, and that selection is what a campaign against the conditions of group existence
      looks like.
    terminal: false
    uncertain: false
    submissionStatus: Accepted

