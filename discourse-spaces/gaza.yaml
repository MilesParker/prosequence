# Extracted from two single-perspective sources representing opposing positions.
# Bartov (NYT, 2025) — Pro: Israel is committing genocide in Gaza.
# Stephens (NYT, July 22 2025) — Anti: Israel is not committing genocide in Gaza.
# Pro/Anti coverage is asymmetric within each source but the pair provides significant dialectical coverage.

id: gaza-genocide
title: "Is Israel's military campaign in Gaza genocide?"

definitions:
  - term: genocide
    text: >
      The intentional destruction, in whole or in part, of a national, ethnic, racial, or
      religious group as such, as defined by the 1948 UN Convention on the Prevention and
      Punishment of the Crime of Genocide. Requires both specific intent (dolus specialis)
      and acts carried out in pursuance of that intent.
    importedFrom: null

  - term: genocidal intent
    text: >
      The specific intent to destroy a protected group as such — not merely to cause
      civilian harm incidental to a military objective. Distinct from general malice,
      recklessness, or disproportionate force. Can be inferred from a pattern of acts
      when direct evidence of intent is unavailable.
    importedFrom: null

  - term: ethnic cleansing
    text: >
      The forced displacement of an ethnic or religious group from a territory, whether
      by expulsion, intimidation, or destruction of conditions for habitation. Distinct
      from genocide in that it aims at removal rather than destruction of the group as
      such, though the two crimes can overlap or morph into each other.
    importedFrom: null

proposition:
  id: prop-gaza-genocide
  tag: Gaza genocide
  text: Israel's military campaign in Gaza constitutes genocide.

terminalValueNodes:
  - id: t-group-existence-inviolable
    tag: Group existence inviolable (terminal)
    text: >
      Every distinct human group has an inviolable right to continued existence as a group,
      and acts that destroy the conditions for that existence are wrong regardless of
      the perpetrator's other justifications.

  - id: t-legal-precision-matters
    tag: Legal precision matters (terminal)
    text: >
      Legal terms that carry grave moral weight must be applied with strict precision;
      promiscuous application destroys the protective function the term was designed to serve.

  - id: t-self-defense-legitimate
    tag: State self-defense legitimate (terminal)
    text: >
      A state subjected to violent attack has a legitimate right to use military force
      to eliminate the threat, including force that causes substantial civilian harm
      when the attacking force uses civilians as cover.

  - id: t-intl-law-universal
    tag: International law is universal (terminal)
    text: >
      International humanitarian law and the Genocide Convention apply universally,
      without exception for any state's history, security situation, or political alliances.

# --- Depth 1: Pro arguments ---

arguments:
  - id: public-genocidal-statements
    tag: Public genocidal statements by leaders
    claim: >
      Israeli political and military leaders publicly expressed intent consistent with
      genocide in the days and months after October 7.
    grounds:
      text: >
        Bartov reports that Netanyahu invoked the biblical Amalek passage widely interpreted
        as demanding total destruction of the enemy, promised to turn parts of Gaza "into
        rubble," called residents to leave because the IDF would "operate forcefully
        everywhere," and that officials called Gazans "human animals" and called for
        "total annihilation"; the deputy speaker of parliament called for "erasing the
        Gaza Strip from the face of the earth."
      quote: "turning parts of Gaza, where Hamas was operating, 'into rubble'"
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromSign
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: pattern-of-ops-genocidal
    tag: Pattern of operations consistent with genocide
    claim: >
      The pattern of IDF operations — systematic destruction of housing, infrastructure,
      and civilian institutions across the entire Strip — is consistent with intent to
      make Palestinian life in Gaza non-reconstitutable.
    grounds:
      text: >
        Bartov reports that a Haaretz investigation found approximately 174,000 buildings
        destroyed or damaged, up to 70 percent of all structures in the Strip, along
        with systematic destruction of hospitals, universities, schools, mosques, cultural
        heritage sites, water treatment plants, agricultural areas, and parks.
      quote: "an estimated 174,000 buildings have been destroyed or damaged, accounting for up to 70 percent of all structures in the Strip"
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025, citing Haaretz investigation"
    scheme: FromSign
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: scholarly-consensus-genocide
    tag: Growing scholarly and legal consensus
    claim: >
      A significant and growing body of genocide scholars and international law experts
      has concluded that Israel's actions in Gaza meet the definition of genocide.
    grounds:
      text: >
        Bartov reports that experts including the UN Special Rapporteur Francesca Albanese,
        Amnesty International, genocide scholars Shmuel Lederman, William Schabas,
        Melanie O'Brien, Martin Shaw, A. Dirk Moses, and Uğur Ümit Üngör have reached
        or are converging on the conclusion that events in Gaza constitute genocide;
        South Africa has brought a genocide case at the ICJ.
      quote: "I don't know them"
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromAuthority
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: denial-damages-intl-law
    tag: Denial damages international legal order
    claim: >
      Continued denial of the genocide designation by states and institutions damages the
      system of international humanitarian law established after the Holocaust.
    grounds:
      text: >
        Bartov argues that the Genocide Convention was designed to obligate all signatory
        states to prevent, stop, and punish genocide wherever it occurs, and that failure
        to apply the designation when warranted erodes that obligation and the legal
        architecture it supports.
      quote: null
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromConsequence
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: ethnic-cleansing-morphs-genocide
    tag: Ethnic cleansing morphing into genocide
    claim: >
      When a population has nowhere to flee and is continuously displaced, bombed, and
      starved, ethnic cleansing morphs into genocide.
    grounds:
      text: >
        Bartov cites historical precedents — the Herero and Nama genocide in German South
        West Africa (1904), the Armenian genocide in World War I, and the Holocaust itself —
        all of which began as expulsion campaigns before becoming genocidal extermination.
      quote: null
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromAnalogy
    cluster: Pro
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 1: Anti arguments ---

  - id: death-toll-inconsistent-genocide
    tag: Death toll inconsistent with genocidal intent
    claim: >
      The scale of Palestinian deaths is far below what a state with Israel's military
      capacity would produce if its intent were genuinely genocidal.
    grounds:
      text: >
        Stephens notes that Israel is the leading military power of its region, has
        decimated Hezbollah and humbled Iran, and could have produced vastly greater
        destruction than roughly 60,000 deaths in nearly two years of war if it had
        intended to exterminate Gazans.
      quote: "why hasn't it been more methodical and vastly more deadly?"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromSign
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: protective-measures-inconsistent-genocide
    tag: Protective measures inconsistent with genocide
    claim: >
      Israel has taken protective measures — advance warnings, targeted strikes,
      acceptance of risk to its own soldiers — that are inconsistent with genocidal intent.
    grounds:
      text: >
        Stephens reports that Israel routinely warned Gazans to evacuate areas before
        striking, risked and lost hundreds of its own soldiers in ground combat rather
        than bombing without restraint, and that Israeli intelligence tracked hostage
        locations with precision, demonstrating discriminate targeting capacity.
      quote: "routinely warning Gazans to evacuate areas it intended to strike"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromSign
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: as-such-intent-absent
    tag: "\"As such\" intent is absent"
    claim: >
      Israel is fighting to defeat Hamas as a military-political force, not to destroy
      Palestinians as a group; this fails the legal "as such" requirement for genocide.
    grounds:
      text: >
        Stephens notes that the UN Genocide Convention's definition requires killing
        people "as such" — solely because they belong to the protected group — and
        distinguishes this from civilian deaths caused by war, citing the Allied bombing
        of German cities in World War II as killing Germans without constituting genocide
        because the aim was to defeat Nazism, not to destroy Germans as Germans.
      quote: "intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025, citing UN Genocide Convention"
    scheme: FromDefinition
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: hamas-tactics-explain-casualties
    tag: Hamas tactics explain civilian casualties
    claim: >
      Hamas's use of civilians as human shields and its tunnel infrastructure, rather
      than Israeli genocidal intent, is the primary explanation for the high civilian
      casualty rate.
    grounds:
      text: >
        Stephens describes Hamas's practice of sheltering its fighters and command
        infrastructure in tunnels while leaving civilians exposed above ground, contrasting
        this with Ukrainian practice where civilians shelter underground while the military
        fights above ground; he also cites the US-backed Mosul campaign against ISIS,
        which used comparable tactics and produced comparable civilian casualties with
        broad bipartisan support.
      quote: "Hamas hides and feeds and preserves itself in its vast warren of tunnels rather than open them to civilians for protection"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromCause
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: promiscuous-genocide-label-harmful
    tag: Promiscuous genocide label is harmful
    claim: >
      Applying the genocide label outside its strict legal meaning dilutes its force and
      ultimately blinds the world to real genocides when they occur.
    grounds:
      text: >
        Stephens argues that "genocide" was coined only in the 1940s and has a specific
        meaning designed to identify a uniquely horrific crime; applying it to any military
        situation one opposes risks normalising the term and destroying its protective function.
      quote: "the abuse of the term 'genocide' runs the risk of ultimately blinding us to real ones when they unfold"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromConsequence
    cluster: Anti
    depth: 1
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 2: Warrant nodes for depth-1 Pro arguments ---

  - id: statements-evidence-intent
    tag: "public statements evidence specific intent"
    claim: >
      When senior political and military leaders publicly articulate objectives that match
      the legal definition of genocidal intent, those statements constitute evidence of
      specific intent, not mere rhetorical excess.
    grounds:
      text: >
        Genocide law, as Bartov notes, permits intent to be inferred from a pattern of
        statements and acts; the Genocide Convention requires dolus specialis — specific
        intent — which courts have found can be established through official statements
        when they are systematic and consistent with the acts carried out.
      quote: null
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025, citing genocide legal scholarship"
    scheme: FromDefinition
    cluster: Pro
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: pattern-establishes-intent
    tag: "systematic destruction pattern establishes intent"
    claim: >
      When the scope and nature of destruction systematically targets the conditions for
      group existence — not just military infrastructure — the pattern itself establishes
      genocidal intent in the absence of direct documentary evidence.
    grounds:
      text: >
        Bartov notes that genocidal intent can be derived from a pattern of operations
        when direct statements of intent are contested; destruction of civilian infrastructure
        beyond any plausible military necessity is the standard evidentiary basis in
        genocide jurisprudence.
      quote: "intent can also be derived from a pattern of operations on the ground"
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromDefinition
    cluster: Pro
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: authority-genocide-scholars
    tag: "genocide scholars are the relevant epistemic authority"
    claim: >
      Scholars who specialise in genocide studies and comparative genocide are better
      positioned than general historians or political commentators to apply the genocide
      definition to contemporary events.
    grounds:
      text: >
        Bartov, citing his own quarter-century of teaching genocide, notes that most
        scholars now converging on the genocide conclusion are genocide specialists,
        while those resisting it are primarily Holocaust historians with no comparative
        genocide background.
      quote: "I have been teaching classes on genocide for a quarter of a century. I can recognize one when I see one."
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromAuthority
    cluster: Pro
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: intl-law-obliges-designation
    tag: "international law obliges states to name genocide to trigger prevention duties"
    claim: >
      The Genocide Convention's prevention and punishment obligations are only triggered
      when the genocide designation is applied; failure to designate events as genocide
      disables the legal mechanism designed to stop it.
    grounds:
      text: >
        Bartov notes that the Convention obliges all signatories to prevent genocide while
        it is occurring and to punish perpetrators afterward; these duties are contingent
        on the designation being made, so refusing to apply the term forecloses the
        Convention's protective function.
      quote: null
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromDefinition
    cluster: Pro
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: morphing-precedent-established
    tag: "historical precedent shows ethnic cleansing reliably morphs into genocide under confinement"
    claim: >
      When a population cannot flee expulsion and is subjected to ongoing destruction of
      survival conditions, the historical record shows that ethnic cleansing reliably
      escalates to genocide.
    grounds:
      text: >
        Bartov cites three cases where expulsion campaigns became genocidal extermination
        when the target population had no escape: the Herero and Nama (1904), the
        Armenians (World War I), and the Jews of Europe (Holocaust), all of which began
        with attempts to force departure before becoming extermination.
      quote: null
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromGeneralization
    cluster: Analogy
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 2: Warrant nodes for depth-1 Anti arguments ---

  - id: capacity-gap-reveals-intent
    tag: "gap between capacity and action reveals intent"
    claim: >
      When a state has demonstrably greater destructive capacity than it is deploying,
      the gap between capacity and action is evidence against the hypothesis that its
      intent is total destruction of the target population.
    grounds:
      text: >
        Stephens observes that Israel has the demonstrated military capacity to have
        produced far higher casualties and far greater destruction than it has — it
        decimated Hezbollah and degraded Iranian capability — making the relatively
        constrained (if devastating) scale of Gaza operations inconsistent with
        a genocidal objective.
      quote: null
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromSign
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: warnings-incompatible-genocide
    tag: "systematic evacuation warnings are incompatible with intent to kill as such"
    claim: >
      An actor intending to destroy a population as such has no rational motive to
      systematically warn that population to evacuate before attacks; the practice of
      issuing such warnings is structurally incompatible with genocidal intent.
    grounds:
      text: >
        Stephens notes that Israel routinely issued advance warnings to civilians to
        evacuate areas before striking, a practice that creates tactical disadvantage
        (alerting the enemy) and is explicable only if reducing civilian casualties
        is a genuine objective, not a pretense.
      quote: null
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromSign
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: legal-definition-as-such
    tag: "the \"as such\" requirement distinguishes genocide from war crimes"
    claim: >
      The UN Genocide Convention's requirement that killing be directed at people "as
      such" — solely because of their group membership — is a necessary and legally
      operative condition that distinguishes genocide from other grave crimes under
      international humanitarian law.
    grounds:
      text: >
        Stephens notes that the Convention's text specifies "as such" as a constitutive
        element, not rhetorical emphasis; the purpose was to distinguish the attempt to
        destroy a group from the incidental killing of group members while pursuing
        other military or political objectives.
      quote: "Note the words 'intent' and 'as such.'"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromDefinition
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: proximate-cause-attribution
    tag: "proximate cause of civilian death determines moral responsibility"
    claim: >
      When an armed group deliberately uses civilians as human shields, the moral and
      legal responsibility for resulting civilian deaths shifts substantially to the
      shielding party, not the attacking force acting within the laws of war.
    grounds:
      text: >
        Stephens argues that Hamas's tunnel strategy — sheltering combatants underground
        while civilians remain exposed above ground — constitutes a war crime in itself
        and is the proximate cause of the civilian death rate, not Israeli genocidal intent.
      quote: null
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromCause
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: term-inflation-undermines-law
    tag: "inflation of a legal term destroys its deterrent and juridical function"
    claim: >
      A legal term whose application is not governed by precise criteria loses its
      capacity to trigger the legal consequences — sanctions, prosecutions, prevention
      duties — it was designed to produce.
    grounds:
      text: >
        Stephens draws on the history of "genocide" as a term coined in the 1940s
        precisely to create a distinct, higher category of crime with distinct legal
        consequences; that function depends on the term being applied only when its
        specific criteria are met.
      quote: null
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromConsequence
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: incorrect-application-damages-convention
    tag: "incorrect application of genocide designation in either direction damages the Convention"
    claim: >
      The Genocide Convention's protective function depends on the designation being
      applied neither too liberally nor too narrowly; systematic error in either direction
      erodes the legal mechanism the Convention was designed to create.
    grounds:
      text: >
        Both Bartov and Stephens invoke the Convention's protective purpose — Bartov
        arguing that under-application disables prevention duties, Stephens arguing that
        over-application dilutes the term's gravity — thereby sharing the premise that
        the Convention's efficacy is calibration-dependent.
      quote: null
      source:
        type: CommonKnowledge
        reference: null
    scheme: FromDefinition
    cluster: Empirical
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 2: Dialectical attacks across positions ---

  - id: few-statements-vs-systematic-policy
    tag: Isolated statements vs. systematic policy
    claim: >
      Inflammatory statements by individual officials do not constitute evidence of a
      systematic state policy of genocide; the relevant question is official policy,
      not rhetorical excess in the heat of conflict.
    grounds:
      text: >
        Stephens acknowledges the statements made by Israeli officials but notes that
        furious comments in the immediate aftermath of a mass atrocity do not constitute
        the equivalent of the Wannsee Conference — a systematic state-level planning
        document — and that he is aware of no evidence of an Israeli plan to deliberately
        target and kill Gazan civilians.
      quote: "furious comments in the wake of Hamas's Oct. 7 atrocities hardly amount to a Wannsee conference"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromSign
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: infrastructure-destruction-beyond-military-necessity
    tag: Infrastructure destruction beyond military necessity
    claim: >
      The scope of civilian infrastructure destruction — hospitals, schools, universities,
      water treatment, cultural sites — exceeds any plausible military necessity and
      indicates an objective of making Gaza uninhabitable as a Palestinian territory.
    grounds:
      text: >
        Bartov reports systematic destruction not only of housing but of all institutions
        necessary for civilian life and for the reconstitution of the group: hospitals,
        universities, schools, mosques, cultural heritage sites, water treatment plants,
        and agricultural areas — a pattern his former IDF chief of staff Moshe Yaalon
        publicly described as ethnic cleansing aimed at clearing northern Gaza of its
        population.
      quote: "the systematic destruction in Gaza not only of housing but also of other infrastructure"
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromSign
    cluster: Pro
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: mosul-analogy
    tag: Mosul analogy — comparable tactics, no genocide charge
    claim: >
      The US-backed Mosul campaign against ISIS used comparable tactics to Israel's
      Gaza campaign and produced comparable civilian casualties, yet no credible genocide
      charge was made against the US or Iraq.
    grounds:
      text: >
        Stephens cites the 2016–17 Mosul campaign, in which American airstrikes leveled
        entire blocks and as many as 11,000 civilians died over nine months as ISIS used
        civilians as human shields, and notes the campaign had broad bipartisan and
        international support with no campus protests or genocide charges.
      quote: "American airstrikes have at times leveled entire blocks"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromAnalogy
    cluster: Analogy
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: mosul-representativeness
    tag: "Mosul analogy is structurally comparable to Gaza"
    claim: >
      The Mosul campaign is a structurally comparable case — a state military operating
      in dense urban terrain against an armed group using human shields and tunnel
      infrastructure — making the absence of a genocide charge in that case evidentially
      relevant to Gaza.
    grounds:
      text: >
        Stephens notes that ISIS, like Hamas, used a booby-trapped underground fortress
        strategy in a dense urban environment, with the same dynamic of combatants below
        ground and civilians above ground that characterises the Gaza campaign.
      quote: "booby-trapped, underground fortress"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromAnalogy
    cluster: Analogy
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: genocide-label-antisemitism-charge
    tag: Genocide label serves antisemitic function
    claim: >
      The genocide charge against Israel is used by anti-Zionists to equate Israel with
      Nazi Germany, licensing Jew-hatred and targeting diaspora Jews who support Israel.
    grounds:
      text: >
        Stephens argues the genocide charge is part of a pattern of "inflated or bogus
        charges" deployed by Israel's opponents to delegitimise the state and generate
        hatred not only of Israeli policy but of Jews who support Israel's existence,
        making supporters of a genocide-committing state guilty of genocide by association.
      quote: "equate modern Israel with Nazi Germany"
      source:
        type: Citation
        reference: "Bret Stephens, New York Times, July 22 2025"
    scheme: FromConsequence
    cluster: Anti
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: genocide-label-silences-critics
    tag: Antisemitism charge silences legitimate critique
    claim: >
      Labelling the genocide designation as antisemitic is itself a mechanism of
      intellectual suppression that immunises Israeli actions from legitimate scrutiny.
    grounds:
      text: >
        Bartov reports that genocide scholars who apply the designation to Gaza have
        been accused by Holocaust historians of "well-poisoning" and antisemitism, and
        specifically that Norman Goda characterised showing images of Palestinian children
        killed by Israeli bombs as an antisemitic act — a position Bartov treats as
        demonstrably untenable.
      quote: "showing images of Palestinian children ripped apart by U.S.-made bombs launched by Israeli pilots is, in this view, an antisemitic act"
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromConsequence
    cluster: Pro
    depth: 2
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  # --- Depth 3: Warrant nodes for depth-2 arguments ---

  - id: intent-inferred-from-conduct
    tag: "genocidal intent is legitimately inferred from conduct when no planning document exists"
    claim: >
      In genocide adjudication, specific intent (dolus specialis) may be established
      by inference from the totality of acts and statements when no direct planning
      document is available; the absence of a Wannsee-style document does not foreclose
      a finding of intent.
    grounds:
      text: >
        Bartov notes that the Genocide Convention permits intent to be derived from
        a pattern of operations; this reflects established genocide jurisprudence in
        which courts including the ICJ and ICTY have found genocidal intent by inference
        from conduct in the absence of direct documentary evidence.
      quote: "intent can also be derived from a pattern of operations on the ground"
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025, citing genocide jurisprudence"
    scheme: FromDefinition
    cluster: Empirical
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: confinement-transforms-cleansing
    tag: Confinement transforms expulsion into group destruction
    claim: >
      When a target population has no adjacent territory to receive them, expulsion
      orders combined with ongoing destruction of survival conditions are functionally
      equivalent to destruction of the group as such — making Gaza structurally
      disanalogous to cases where the displaced population could flee.
    grounds:
      text: >
        Bartov argues that Gaza's borders are sealed by Egypt and Israel, so displacement
        orders combined with bombardment are equivalent to an order to cease to exist as
        a group; Stephens's Mosul analogy is undermined by this structural difference,
        since Mosul's civilian population could and did flee the city whereas Gazans
        have no receiving territory.
      quote: null
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025; Bret Stephens, New York Times, July 22 2025"
    scheme: FromDefinition
    cluster: Pro
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

  - id: holocaust-memory-universalism
    tag: "Holocaust memory carries a universal obligation, not ethnic-specific protection"
    claim: >
      The moral authority Holocaust remembrance generates is premised on the universality
      of its lesson; invoking that memory to shield a state from genocide charges
      contradicts the foundation of the authority being claimed.
    grounds:
      text: >
        Bartov argues that Holocaust commemoration succeeded in finding a universal
        audience precisely by presenting its lesson as a warning for all humanity;
        using Holocaust victimhood as a justification for inhumanity toward others
        transforms the lesson into its opposite and destroys the moral credit it generates.
      quote: "transforming its meaning from an assertion of resistance to inhumanity wherever it is perpetrated to an excuse"
      source:
        type: Citation
        reference: "Omer Bartov, New York Times, 2025"
    scheme: FromDefinition
    cluster: Pro
    depth: 3
    isMediating: false
    uncertain: false
    submissionStatus: Accepted

