# mypy configuration. Committed so `python3 -m mypy prosequence/` needs no
# flags and every run — local or CI — checks the same thing.
#
# Not `--strict`. The codebase has large untyped seams by design (the session
# object passed into an op, LangChain/LangGraph state), and turning on
# disallow_untyped_defs would produce hundreds of findings that say nothing
# about correctness. What is enabled below is the subset that catches real
# defects: unreachable code, bad casts, and untyped-decorator masking.

[mypy]
python_version = 3.14
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True

# Check the bodies of unannotated functions too. Most check_* functions in
# prosequence/tests are untyped defs; without this their bodies are skipped
# entirely, which made the suite look clean while hiding real findings
# (an unindexed Corpus attribute, an unguarded Optional ToolNode).
check_untyped_defs = True

# Vendored SDK stubs are incomplete in places (pygit2 tree entries type `name`
# as Optional, blobs surface as the base Object). Those are narrowed at the
# call site with an explicit cast rather than silenced here.
